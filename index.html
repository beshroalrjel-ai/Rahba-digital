<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123f2b">
<title>أغنامي | منظومة الرحبة الرقمية</title>
<style>
:root{--green:#123f2b;--green2:#1d6545;--gold:#d7b65d;--bg:#f4f5ef;--ink:#203329}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
header{background:linear-gradient(130deg,var(--green),var(--green2));color:white;padding:28px 20px 34px;border-radius:0 0 28px 28px}
.wrap{max-width:1050px;margin:auto;padding:0 16px}h1{margin:0;font-size:28px}header p{margin:8px 0 0;color:#e8eadf}
main{margin-top:-16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:white;border:1px solid #e7e6dc;border-radius:18px;padding:18px;box-shadow:0 5px 20px #163b2610}
.stat strong{display:block;font-size:27px;color:var(--green);margin-top:8px}.stat span{color:#68766c;font-size:13px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:12px;padding:13px 18px;background:var(--green);color:white;font-weight:bold;cursor:pointer}.btn.gold{background:var(--gold);color:#263526}
input,select{padding:12px;border:1px solid #d9dfd5;border-radius:10px;background:#fff;font:inherit;width:100%}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin:18px 0}
.animal{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #edf0e9;padding:14px 0}.muted{color:#778178;font-size:13px}.tag{background:#edf5ee;color:#24583c;padding:5px 9px;border-radius:20px;font-size:12px}
#login{max-width:420px;margin:40px auto}.hidden{display:none}
@media(max-width:620px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}.formgrid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}h1{font-size:23px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>أغنامي</h1><p>منظومة الرحبة الرقمية لإدارة أغنامك</p></div></header>
<div class="wrap"><main>
<section id="login" class="card">
<h2>الدخول إلى حسابك</h2><p class="muted">استخدم رقم الهاتف وكلمة المرور الخاصة بحسابك.</p>
<div class="formgrid"><input id="phone" type="tel" placeholder="رقم الهاتف"><input id="password" type="password" placeholder="كلمة المرور"></div>
<div class="actions"><button class="btn" id="loginBtn">دخول</button><button class="btn gold" id="signupBtn">إنشاء حساب</button></div><p id="authMsg" class="muted"></p>
</section>
<section id="app" class="hidden">
<div class="stats">
<div class="card stat"><span>إجمالي الأغنام</span><strong id="total">0</strong></div>
<div class="card stat"><span>الفحول</span><strong id="rams">0</strong></div>
<div class="card stat"><span>حالة القطيع</span><strong id="health">—</strong></div>
</div>
<div class="actions"><button class="btn gold" id="showAdd">＋ إضافة رأس جديد</button><button class="btn" id="logout">تسجيل الخروج</button></div>
<section id="addPanel" class="card hidden"><h2>إضافة رأس جديد</h2>
<div class="formgrid">
<input id="code" placeholder="رقم/معرّف الرأس" required><input id="name" placeholder="اسم الرأس">
<select id="sex"><option value="female">أنثى</option><option value="male">ذكر</option></select>
<select id="category"><option value="lamb">مولود</option><option value="ewe_lamb">حايل فطيمة</option><option value="ram_lamb">حولي</option><option value="ewe">نعجة</option><option value="ram">فحل</option></select>
<input id="birth" type="date"><input id="weight" type="number" min="0" step=".1" placeholder="الوزن بالكيلو">
<select id="status"><option value="good">جيدة</option><option value="monitor">تحت المراقبة</option><option value="sick">مريضة</option><option value="treated">تحت العلاج</option></select>
<input id="breed" placeholder="السلالة"><input id="notes" placeholder="ملاحظات">
</div><div class="actions"><button class="btn" id="saveSheep">حفظ الرأس</button><button class="btn gold" id="cancelAdd">إلغاء</button></div><p id="saveMsg" class="muted"></p>
</section>
<div class="toolbar"><input id="search" placeholder="بحث في أغنامي"><span class="tag" id="count">0 رأس</span></div>
<section class="card"><h2>سجل أغنامي</h2><div id="animals"><p class="muted">سجّل الدخول لعرض بيانات قطيعك.</p></div></section>
</section></main></div>
<script type="module" src="./src/app.js"></script>
</body></html>
